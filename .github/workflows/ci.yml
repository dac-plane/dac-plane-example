name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check is a recipe in the justfile, so CI and `just ci` run the same
# commands. Tool versions (Node, pnpm, just) come from mise.toml.
jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: just install

      - name: Lint
        run: just lint

      - name: Lint workflows
        run: just lint-workflows

      - name: Typecheck
        run: just typecheck

      - name: Test
        run: just test

      - name: Build
        run: just build
